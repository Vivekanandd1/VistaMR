name: Java CI

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 7 * * 1-5'   # 12:30 PM IST (Mon–Fri)
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean test
