# ===========================================
# PreVista Automation Framework Configuration
# ===========================================
# This file contains default configuration values.
# Override these using .env file or environment variables.
# ===========================================

# Application Profile (local, qa, staging, prod, ci)
PROFILE=local

# ==================== Browser Configuration ====================
# Supported browsers: chrome, firefox, edge
BROWSER=chrome

# Run browser in headless mode (true/false)
HEADLESS=true

# Remote WebDriver execution (for Selenium Grid)
REMOTE_EXECUTION=false
REMOTE_WEBDRIVER_URL=http://localhost:4444/wd/hub

# ==================== Application URLs ====================
BASE_URL=https://vista.kreditz-dev.com
APP_URL=https://vista.kreditz-dev.com/login

# ==================== Timeout Configuration (seconds) ====================
IMPLICIT_WAIT=10
EXPLICIT_WAIT=30
PAGE_LOAD_TIMEOUT=60
SCRIPT_TIMEOUT=30

# ==================== Test Credentials ====================
# Override these in .env file or environment variables
Email=
Password=

# ==================== Database Configuration ====================
DB_HOST=localhost
DB_PORT=3306
DB_NAME=UserCred
DB_USER=root
DB_PASSWORD=

# ==================== API Configuration ====================
API_BASE_URL=https://vista.kreditz-dev.com
API_CLIENT_ID=c71f1c07cb4b46f074c2592d1c7761

# ==================== Screenshot Configuration ====================
SCREENSHOT_ON_FAILURE=true
SCREENSHOT_DIR=screenshots

# ==================== Logging Configuration ====================
LOG_LEVEL=INFO

# ==================== Retry Configuration ====================
# Number of times to retry failed tests
MAX_RETRY_COUNT=2

# ==================== Test Execution ====================
# Enable parallel execution
PARALLEL_EXECUTION=true
THREAD_COUNT=2
